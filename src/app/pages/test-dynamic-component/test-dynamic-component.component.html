<ng-template #content><app-weather-content></app-weather-content></ng-template>

<div>
  <ng-container #container></ng-container>
  <div [className]="'button-container'">
    <button [className]="'button'" (click)="createComponent()">Create Component</button>
    <button [className]="'button'" (click)="destroyComponent()">Delete Component</button>
  </div>
</div>

<br />
<br />
<br />
<br />

<div class="container" style="border: 1px solid #ccc; background-color: #ccc; padding: 10px;">
  <h2>Angular WebSocket Chat</h2>
  <input [(ngModel)]="messageToSend" placeholder="Nhập tin nhắn..." />
  <button (click)="sendMessage()">Gửi</button>
  <button (click)="closeConnection()">Đóng kết nối</button>
</div>
